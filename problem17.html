<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FakestoreAPI Products</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    margin: 20px;
}

#product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.product-card {
    border: 1px solid #ccc;
    padding: 15px;
    text-align: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.product-card img {
    max-width: 100%;
    height: 150px;
    object-fit: contain;
    margin-bottom: 10px;
}

.product-card h2 {
    font-size: 1.2em;
    margin-bottom: 5px;
}

.product-card p {
    font-weight: bold;
    color: #333;
}

/* Conditional Styling */
.yellow-border {
    border: 2px solid yellow;
}

.green-border {
    border: 2px solid green;
}
    </style>
</head>
<body>
    <h1>FakestoreAPI Products</h1>
    <div id="product-grid"></div>
</body>
</html>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
    const productGrid = document.getElementById('product-grid');

    fetch('https://fakestoreapi.com/products')
        .then(response => response.json())
        .then(data => {
            data.forEach(product => {
                const productCard = document.createElement('div');
                productCard.classList.add('product-card');
                
                if (product.price > 50) {
                    productCard.classList.add('yellow-border');
                } else {
                    productCard.classList.add('green-border');
                }

                const productImage = document.createElement('img');
                productImage.src = product.image;
                productImage.alt = product.title;

                const productTitle = document.createElement('h2');
                productTitle.textContent = product.title;

                const productPrice = document.createElement('p');
                productPrice.textContent = `$${product.price.toFixed(2)}`;

                productCard.appendChild(productImage);
                productCard.appendChild(productTitle);
                productCard.appendChild(productPrice);

                productGrid.appendChild(productCard);
            });
        })
        .catch(error => {
            console.error('Error fetching products:', error);
            productGrid.textContent = 'Failed to load products. Please try again later.';
        });
});
    </script>
